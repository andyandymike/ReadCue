name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run standard-library tests without installing dependencies
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Install build tools
        run: python -m pip install build "setuptools>=77" wheel

      - name: Build wheel and source distribution
        run: python -m build --no-isolation

      - name: Check distribution contents
        run: python tools/check_distribution.py --dist dist

      - name: Install and check the wheel outside the checkout
        run: >-
          python -c "import os, pathlib, subprocess, sys, tempfile;
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']);
          artifact = next((root / 'dist').glob('*.whl'));
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-index', '--no-deps', '--no-build-isolation', '--force-reinstall', str(artifact)], check=True);
          subprocess.run([sys.executable, '-I', '-m', 'readcue', '--project', str(root), 'verify'], cwd=tempfile.gettempdir(), check=True)"

      - name: Install and check the source distribution outside the checkout
        run: >-
          python -c "import os, pathlib, subprocess, sys, tempfile;
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']);
          artifact = next((root / 'dist').glob('*.tar.gz'));
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-index', '--no-deps', '--no-build-isolation', '--force-reinstall', str(artifact)], check=True);
          subprocess.run([sys.executable, '-I', '-m', 'readcue', '--project', str(root), 'verify'], cwd=tempfile.gettempdir(), check=True)"
