[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readcue"
version = "0.1.0"
description = "Reproducible small-model reading experiments and evidence tools"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
keywords = ["text-normalization", "chinese-nlp", "reproducible-research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/andyandymike/ReadCue"
Documentation = "https://github.com/andyandymike/ReadCue/tree/main/docs"
Issues = "https://github.com/andyandymike/ReadCue/issues"

[project.scripts]
readcue = "readcue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["readcue*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
readcue = ["review.html"]
