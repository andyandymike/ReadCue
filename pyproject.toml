[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readcue"
version = "0.1.0"
description = "Reproducible small-model reading experiments and evidence tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
readcue = "readcue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
